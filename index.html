<!doctype html>
<html lang="ru" data-accent="lime" data-bg="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Толипов Дилмурод — Data / BI-аналитик</title>
<meta name="description" content="Резюме-дашборд Data / BI-аналитика: SQL, PostgreSQL, ClickHouse, BigQuery, Power BI, Tableau, Visiology, Excel, Python.">
<meta property="og:title" content="Толипов Дилмурод — Data / BI-аналитик">
<meta property="og:description" content="300+ открытых дашбордов для Ташкента. SQL, Power BI, Tableau, Visiology, Python.">
<meta property="og:type" content="profile">
<meta name="theme-color" content="#101114">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23101114'/%3E%3Crect x='6' y='17' width='5' height='9' fill='%23CCFF00'/%3E%3Crect x='13.5' y='11' width='5' height='15' fill='%23CCFF00'/%3E%3Crect x='21' y='6' width='5' height='20' fill='%23CCFF00'/%3E%3C/svg%3E">
<script>
  /* тема применяется до отрисовки, чтобы не было вспышки */
  try {
    var s = JSON.parse(localStorage.getItem("theme") || "{}");
    if (["black", "cyan", "lime"].indexOf(s.accent) > -1) document.documentElement.dataset.accent = s.accent;
    if (["paper", "dark"].indexOf(s.bg) > -1) document.documentElement.dataset.bg = s.bg;
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..900&display=swap" rel="stylesheet">
<style>
/* ---------- ТЕМЫ ----------
   --bg       фон страницы
   --fg       основной текст      --fg-2 / --fg-3  вторичный текст
   --soft     тонкие разделители
   --line     рамки плиток и кнопок
   --fill     заливки: плашки, бары, выбранные фильтры
   --on-fill  текст на заливке
*/
:root{
  --cyan:#00E5FF;
  --lime:#CCFF00;
  --paper:#F7F2E6;
  --night:#101114;

  --bg:var(--paper);
  --fg:#000;
  --fg-2:#48443B;
  --fg-3:#8C8575;
  --soft:#EDE5D2;
  --line:#000;
  --fill:#000;
  --on-fill:var(--paper);

  --bw:1.5px;
  --gap:16px;
  --pad:clamp(16px,3.2vw,40px);
  --font:"Geologica",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
[data-accent="cyan"]{--fill:var(--cyan);--on-fill:var(--night);--line:#007F8C}
[data-accent="lime"]{--fill:var(--lime);--on-fill:var(--night);--line:#557000}
[data-bg="dark"]{--bg:var(--night);--fg:var(--paper);--fg-2:#B5B0A5;--fg-3:#77756F;--soft:#26282E;--fill:var(--paper);--on-fill:var(--night);--line:var(--paper);color-scheme:dark}
[data-bg="dark"][data-accent="cyan"]{--fill:var(--cyan);--line:var(--cyan)}
[data-bg="dark"][data-accent="lime"]{--fill:var(--lime);--line:var(--lime)}
:root{
  --on-fill-2:color-mix(in srgb,var(--on-fill) 70%,var(--fill));
  --fill-line:color-mix(in srgb,var(--on-fill) 22%,var(--fill));
}
.theming,.theming *{transition:background-color .35s ease,color .35s ease,border-color .35s ease,fill .35s ease,stroke .35s ease!important}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:132px;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.55;padding-bottom:64px;-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.inverse :focus-visible{outline-color:var(--on-fill)}
h1,h2,h3,p{margin:0}
.wrap{max-width:1360px;margin:0 auto;padding:0 var(--pad)}
.num{font-variant-numeric:tabular-nums lining-nums}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.topbar{position:sticky;top:0;z-index:30;background:var(--fill);color:var(--on-fill)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none}
.brand-mark{width:28px;height:28px;flex-shrink:0;display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:3px;padding:5px;border:var(--bw) solid var(--on-fill)}
.brand-mark i{display:block;background:var(--on-fill)}
.brand-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-upd{color:var(--on-fill-2);font-size:13px;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:var(--bw) solid var(--on-fill)}
.seg button{background:transparent;border:0;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--on-fill)}
.seg button[aria-pressed="true"]{background:var(--on-fill);color:var(--fill)}
.sw{display:inline-flex;align-items:flex-end;gap:2px;height:14px;flex-shrink:0;font-style:normal}
.sw i{display:block;width:6px;border:1px solid currentColor}
iframe{color-scheme:light}

.btn{display:inline-flex;align-items:center;gap:8px;border:var(--bw) solid var(--line);background:transparent;padding:8px 14px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--fill);color:var(--on-fill)}
.btn-fill{background:var(--fill);color:var(--on-fill)}
.btn-fill:hover{background:var(--bg);color:var(--fg)}
.inverse .btn{border-color:var(--on-fill)}
.inverse .btn:hover{background:var(--on-fill);color:var(--fill)}
.inverse .btn-fill{background:var(--on-fill);color:var(--fill)}
.inverse .btn-fill:hover{background:transparent;color:var(--on-fill)}
.btn svg{width:16px;height:16px;flex-shrink:0}
.topbar .btn{padding:4px 10px;font-size:13px}

.filters{position:sticky;top:52px;z-index:25;background:var(--bg);border-bottom:var(--bw) solid var(--line)}
.filters .wrap{display:flex;align-items:center;gap:20px;min-height:64px;padding-top:10px;padding-bottom:10px}
.f-title{font-weight:700;font-size:15px;white-space:nowrap}
.f-groups{display:flex;flex-wrap:wrap;gap:8px 18px;flex:1;min-width:0;padding:2px}
.f-group{display:flex;align-items:center;gap:6px;flex-shrink:0}
.f-group-name{font-size:12px;color:var(--fg-2);margin-right:2px;white-space:nowrap}
.chip{border:var(--bw) solid var(--line);background:transparent;padding:5px 11px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;line-height:1.2}
.chip:hover{background:var(--soft)}
.chip[aria-pressed="true"]{background:var(--fill);color:var(--on-fill)}
.f-meta{display:flex;align-items:center;gap:10px;flex-shrink:0}
.f-count{font-size:13px;color:var(--fg-2);white-space:nowrap}
.f-count b{color:var(--fg)}
.linkbtn{background:none;border:0;padding:4px 2px;font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;white-space:nowrap}

section{padding:clamp(40px,6vw,72px) 0 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.sec-title{font-size:clamp(34px,5vw,60px);font-weight:800;letter-spacing:-.035em;line-height:.95}
.sec-note{color:var(--fg-2);max-width:46ch;font-size:15px}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}
.tile{border:var(--bw) solid var(--line);padding:22px 24px;min-width:0;background:var(--bg)}
.tile.inverse{background:var(--fill);color:var(--on-fill)}
.tile-title{font-size:17px;font-weight:700;margin-bottom:4px}
.tile-sub{font-size:13px;color:var(--fg-2);margin-bottom:18px}
.inverse .tile-sub{color:var(--on-fill-2)}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}

.fx{transition:opacity .25s ease}
.is-dim{opacity:.22}

.hero{padding-top:clamp(28px,4vw,48px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,3vw,40px);align-items:stretch}
.hero-name{font-size:clamp(46px,6vw,88px);font-weight:900;letter-spacing:-.05em;line-height:.86;margin-bottom:22px}
.hero-name span{display:block}
.hero-role{font-size:clamp(20px,2vw,26px);font-weight:600;letter-spacing:-.01em;margin-bottom:14px}
.hero-sum{font-size:17px;line-height:1.6;color:var(--fg-2);max-width:44ch;margin-bottom:26px}
.hero-contacts{display:flex;flex-wrap:wrap;gap:8px}
.hero-left{display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.hero-city{font-size:14px;color:var(--fg-2);display:flex;gap:8px;align-items:center}

.live{background:var(--fill);color:var(--on-fill);display:flex;flex-direction:column;min-width:0;margin:0}
.live-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.live-dot{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.live-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-fill);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.live-screen{position:relative;overflow:hidden;aspect-ratio:16/10;margin:0 16px;border:1px solid var(--fill-line);background:#151515}
.live-screen iframe{position:absolute;top:0;left:0;width:1440px;height:900px;border:0;transform-origin:0 0;pointer-events:none}
.live-open{position:absolute;inset:0;background:transparent;border:0;cursor:zoom-in}
.live-cap{padding:14px 16px 16px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.live-cap h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.live-cap p{font-size:13px;color:var(--on-fill-2)}

.kpis{margin-top:var(--gap);background:var(--fill);color:var(--on-fill);display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{padding:22px 24px 24px;border-left:1px solid var(--fill-line)}
.kpi:first-child{border-left:0}
.kpi-v{font-size:clamp(40px,4.6vw,68px);font-weight:800;letter-spacing:-.04em;line-height:1}
.kpi-l{font-size:14px;color:var(--on-fill-2);margin-top:8px;max-width:18ch}
.todo{color:var(--fg-3)}
.kpis .todo{color:var(--on-fill-2)}

.scroll-x{overflow-x:auto;overflow-y:hidden}
.f-groups,.pages .wrap{scrollbar-width:none}
.f-groups::-webkit-scrollbar,.pages .wrap::-webkit-scrollbar{display:none}
.gantt{min-width:640px}
.g-row,.g-axis{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:center}
.g-row{padding:28px 0 10px;border-top:1px solid var(--soft)}
.g-row:first-of-type{border-top:0}
.g-label b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.g-label span{display:block;font-size:13px;color:var(--fg-2)}
.g-track{position:relative;height:30px;background-image:linear-gradient(to right,var(--fg-3) 1px,transparent 1px);background-size:calc(100% / 6) 100%}
.g-bar{position:absolute;top:4px;bottom:4px;background:var(--fill);border:var(--bw) solid var(--line);transform-origin:left center;animation:grow .9s cubic-bezier(.2,.7,.1,1) both}
.g-bar.plan{background:repeating-linear-gradient(-45deg,var(--line) 0 2px,transparent 2px 6px);animation-name:fade}
.g-dates{position:absolute;top:-2px;transform:translateY(-100%);font-size:12px;color:var(--fg-2);white-space:nowrap}
.g-today{position:absolute;top:-6px;bottom:-6px;border-left:2px solid var(--fg)}
.g-axis{margin-top:6px}
.g-years{position:relative;height:18px;font-size:12px;color:var(--fg-2)}
.g-years span{position:absolute;top:0;padding-left:5px}
.g-today-l{position:absolute;top:0;transform:translateX(-50%);font-size:12px;font-weight:700;background:var(--bg);color:var(--fg);padding:0 4px}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes fade{from{opacity:0}}
.legend{display:flex;gap:18px;font-size:13px;color:var(--fg-2);margin-top:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:22px;height:12px;vertical-align:-1px;margin-right:6px;background:var(--fill);border:1px solid var(--line)}
.legend i.plan{background:repeating-linear-gradient(-45deg,var(--line) 0 2px,transparent 2px 6px)}

.job-head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:6px}
.job-role{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.job-org{font-size:15px;font-weight:600;margin-bottom:2px}
.job-meta{font-size:13px;color:var(--fg-2);margin-bottom:18px}
.job-dur{font-size:13px;font-weight:700;border:var(--bw) solid var(--line);padding:2px 8px;white-space:nowrap}
.bul{list-style:none;padding:0;margin:0 0 18px}
.bul li{position:relative;padding:9px 0 9px 22px;border-top:1px solid var(--soft);font-size:15px;line-height:1.5}
.bul li::before{content:"";position:absolute;left:1px;top:16px;width:10px;height:10px;background:var(--fill);border:1px solid var(--line)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:500;border:1px solid var(--line);padding:2px 7px;line-height:1.3;white-space:nowrap}
.tag.hit{background:var(--fill);color:var(--on-fill)}
.inverse .tag{border-color:var(--on-fill)}
.inverse .tag.hit{background:var(--on-fill);color:var(--fill)}

.dash{display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-height:300px}
.dash-stat{font-size:clamp(40px,4.4vw,60px);font-weight:800;letter-spacing:-.04em;line-height:1}
.dash-statl{font-size:14px;color:var(--on-fill-2);margin-top:6px}
.dash h3{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.dash-note{font-size:13px;color:var(--on-fill-2);margin-bottom:14px}
.dash-actions{display:flex;flex-wrap:wrap;gap:8px}
.slot{border-style:dashed;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;min-height:300px;color:var(--fg-2)}
.slot b{color:var(--fg);font-size:16px}
.slot p{font-size:13px;max-width:30ch}
.slot .slot-n{font-size:clamp(40px,4.4vw,60px);font-weight:800;letter-spacing:-.04em;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--fg-3);max-width:none;margin-bottom:8px}

.proj{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:16px 0;border-top:1px solid var(--soft)}
.proj:first-child{border-top:0;padding-top:0}
.proj h3{font-size:17px;font-weight:700}
.proj p{font-size:14px;color:var(--fg-2);grid-column:1/-1}
.proj .tags{grid-column:1/-1;margin-top:4px}
.draft{font-size:12px;font-weight:600;border:1px dashed var(--fg-3);color:var(--fg-2);padding:1px 7px;align-self:start;white-space:nowrap}

.mx{width:100%;border-collapse:collapse;font-size:14px}
.mx th{font-size:12px;font-weight:600;color:var(--fg-2);text-align:center;padding:0 4px 10px;width:21%}
.mx th:first-child{text-align:left;width:auto}
.mx td{padding:0;border-top:1px solid var(--soft);text-align:center;height:34px}
.mx td:first-child{text-align:left}
.mx-name{background:none;border:0;padding:6px 0;font-size:14px;font-weight:500;cursor:pointer;text-align:left;width:100%}
.mx-name:hover{text-decoration:underline;text-underline-offset:3px}
.mx tr.hit .mx-name{font-weight:800}
.cell{display:inline-block;width:16px;height:16px;background:var(--fill);border:1px solid var(--line);vertical-align:middle}
.cell.no{width:10px;height:2px;background:var(--fg-3);border:0}

.lang{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--soft)}
.lang:first-of-type{border-top:0;padding-top:0}
.lang b{font-weight:600;font-size:15px}
.lang span{font-size:13px;color:var(--fg-2);text-align:right}
.cefr{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.cefr i{display:block;height:8px;border:1px solid var(--line)}
.cefr i.on{background:var(--fill)}
.cefr-l{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;font-size:12px;color:var(--fg-3)}
.cefr-l i{font-style:normal}
.edu b{display:block;font-size:17px;font-weight:700;line-height:1.3}
.edu p{font-size:14px;color:var(--fg-2);margin-top:4px}
.edu + .edu{margin-top:16px;padding-top:16px;border-top:1px solid var(--soft)}

.schema svg{width:100%;height:auto;display:block}
.schema text{font-family:var(--font)}
.sch-l{stroke:var(--line);stroke-width:1.5}
.sch-dim{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.sch-t{fill:var(--fg)}
.sch-s{fill:var(--fg-2)}
.sch-fact{fill:var(--fill);stroke:var(--line);stroke-width:1.5}
.sch-ft{fill:var(--on-fill)}
.sch-fs{fill:var(--on-fill-2)}
.contact-big{font-size:clamp(18px,1.95vw,28px);font-weight:800;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere;text-decoration:none;display:block;margin:6px 0 4px}
.contact-big:hover{text-decoration:underline;text-underline-offset:5px}
.foot-note{font-size:13px;color:var(--fg-2);padding:28px 0 12px}

.pages{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:var(--bw) solid var(--line)}
.pages .wrap{display:flex;gap:0;overflow-x:auto;height:48px;align-items:stretch}
.pages a{display:flex;align-items:center;padding:0 18px;font-size:14px;font-weight:600;text-decoration:none;border-right:1px solid var(--soft);white-space:nowrap}
.pages a:first-child{border-left:1px solid var(--soft)}
.pages a:hover{background:var(--soft)}
.pages a[aria-current="true"]{background:var(--fill);color:var(--on-fill)}
.pg-short{display:none}

dialog{border:var(--bw) solid var(--fill);padding:0;background:var(--fill);color:var(--on-fill);width:min(1500px,96vw);height:min(940px,92vh);max-width:none;max-height:none}
dialog::backdrop{background:rgba(0,0,0,.72)}
.dlg{display:flex;flex-direction:column;height:100%}
.dlg-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--fill-line)}
.dlg-bar h2{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg iframe{flex:1;width:100%;border:0;background:#151515}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--fill);color:var(--on-fill);border:var(--bw) solid var(--line);padding:10px 16px;font-size:14px;font-weight:600;z-index:40}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:nth-child(4){border-left:0}
  .kpi:nth-child(n+4){border-top:1px solid var(--fill-line)}
  .s8,.s7,.s5{grid-column:span 12}
  .s4{grid-column:span 6}
  .brand-upd{display:none}
}
@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr}
  .s6,.s4{grid-column:span 12}
  html{scroll-padding-top:124px}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}

  /* шапка уезжает при прокрутке, закреплён только фильтр */
  .topbar{position:relative}
  .topbar .wrap{height:60px}
  .brand{min-height:44px;min-width:44px}
  .mx td{height:44px}
  .mx-name{min-height:44px}
  .top-actions{gap:6px}
  .top-actions .btn{min-width:44px;min-height:44px;justify-content:center;padding:0 10px}
  .top-actions .btn span:not(.sw){display:none}
  .seg button{min-width:44px;min-height:44px}

  .filters{top:0}
  .filters .wrap{flex-wrap:wrap;gap:2px 12px;min-height:0;padding-top:4px;padding-bottom:10px}
  .f-title{display:none}
  .f-meta{order:1;width:100%;justify-content:space-between;min-height:36px}
  .linkbtn{padding:10px 6px}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const params = new URLSearchParams(location.search);
let lang = params.get("lang") === "en" ? "en" : "ru";
const ALL_TOOLS = STACK.flatMap((g) => g.items);
let selected = new Set((params.get("stack") || "").split(",").filter((t) => ALL_TOOLS.includes(t)));

const L = (o) => (o == null ? "" : typeof o === "string" ? o : o[lang] ?? o.ru);
const T = (k) => UI[lang][k];
function plural(n, f) {
  const a = n % 100, b = n % 10;
  if (a > 10 && a < 20) return f[2];
  if (b === 1) return f[0];
  if (b >= 2 && b <= 4) return f[1];
  return f[2];
}
const ym = (s) => { const [y, m] = s.split("-").map(Number); return { y, m }; };
const now = new Date();
const nowYM = { y: now.getFullYear(), m: now.getMonth() + 1 };
const monthsBetween = (a, b) => (b.y - a.y) * 12 + (b.m - a.m);
const fmtYM = (s) => { const { y, m } = ym(s); return `${T("mo")[m - 1]} ${y}`; };
const tagsHTML = (tags) => (tags || []).map((t) => `<span class="tag" data-tag="${esc(t)}">${esc(t)}</span>`).join("");
const fx = (tags) => `class="fx" data-tags="${esc((tags || []).join("|"))}"`;

const root = document.documentElement;
const idx = (list, id) => Math.max(0, list.findIndex((x) => x.id === id));
function renderThemeButtons() {
  const a = ACCENTS[idx(ACCENTS, root.dataset.accent)];
  const aNext = ACCENTS[(idx(ACCENTS, a.id) + 1) % ACCENTS.length];
  const b = BACKGROUNDS[idx(BACKGROUNDS, root.dataset.bg)];
  const bNext = BACKGROUNDS[(idx(BACKGROUNDS, b.id) + 1) % BACKGROUNDS.length];
  const bars = (list, cur) => list.map((x) => `<i style="background:${x.swatch};height:${x.id === cur ? 14 : 7}px"></i>`).join("");
  $("#accent-sw").innerHTML = bars(ACCENTS, a.id);
  $("#accent-lbl").textContent = L(a.label);
  $("#accent-btn").setAttribute("aria-label", T("accentAria")(L(a.label), L(aNext.label)));
  $("#bg-sw").innerHTML = bars(BACKGROUNDS, b.id);
  $("#bg-lbl").textContent = L(b.label);
  $("#bg-btn").setAttribute("aria-label", T("bgAria")(L(b.label), L(bNext.label)));
}
function setTheme(key, list) {
  root.classList.add("theming");
  clearTimeout(setTheme.t);
  setTheme.t = setTimeout(() => root.classList.remove("theming"), 450);
  root.dataset[key] = list[(idx(list, root.dataset[key]) + 1) % list.length].id;
  try { localStorage.setItem("theme", JSON.stringify({ accent: root.dataset.accent, bg: root.dataset.bg })); } catch (_) {}
  renderThemeButtons();
}
$("#accent-btn").onclick = () => setTheme("accent", ACCENTS);
$("#bg-btn").onclick = () => setTheme("bg", BACKGROUNDS);

  // KPIs
  const yrs = Math.floor(monthsBetween(ym(PROFILE.careerStart), nowYM) / 12);

  }).join("");

  // Gantt
  const START = { y: 2023, m: 1 }, SPAN = 72;

  const rows = [

  // Gallery

    if (d.url) {
      slotN++;

  $$("[data-dash]").forEach((b) => (b.onclick = () => openDash(DASHBOARDS[+b.dataset.dash])));

function bindTools() {
  $$("[data-tool]").forEach((b) => (b.onclick = () => {
    const t = b.dataset.tool;
    selected.has(t) ? selected.delete(t) : selected.add(t);
    applyFilter(); syncURL();
  }));
}

function applyFilter() {
  const on = selected.size > 0;
  $$(".chip").forEach((c) => c.setAttribute("aria-pressed", String(selected.has(c.dataset.tool))));
  $$(".tag").forEach((t) => t.classList.toggle("hit", selected.has(t.dataset.tag)));
  let hits = 0, total = 0;
  $$(".fx").forEach((el) => {
    const tags = (el.dataset.tags || "").split("|").filter(Boolean);
    const match = tags.some((t) => selected.has(t));
    const neutral = el.dataset.neutral === "1";
    el.classList.toggle("is-dim", on && !match && !neutral);
    if (el.matches("tr")) el.classList.toggle("hit", on && match);
    if (el.dataset.fact) { total++; if (match) hits++; }
  });
  $("#count").innerHTML = on ? T("countSel")(hits, total) : T("countAll")(total);
  $("#reset").hidden = $("#share").hidden = !on;
}

function syncURL() {
  const p = new URLSearchParams();
  if (selected.size) p.set("stack", [...selected].join(","));
  if (lang !== "ru") p.set("lang", lang);
  const q = p.toString();
  history.replaceState(null, "", q ? `?${q}${location.hash}` : location.pathname + location.hash);
}

function openDash(d) {
  $("#dlg-title").textContent = L(d.title);
  $("#dlg-new").href = d.url;
  $("#dlg-frame").title = L(d.title);
  $("#dlg-frame").src = d.url;
  $("#dlg").showModal();
}
$("#dlg-close").onclick = () => $("#dlg").close();
$("#dlg").addEventListener("close", () => { $("#dlg-frame").src = "about:blank"; });
$("#dlg").addEventListener("click", (e) => { if (e.target === $("#dlg")) $("#dlg").close(); });

function sizeLive() {
  const scr = $("#live-screen"), fr = $("#live-frame");
  if (!scr || !fr) return;
  fr.style.transform = `scale(${scr.clientWidth / 1440})`;
}
new ResizeObserver(sizeLive).observe($("#live-screen"));

let pageObs;
function observePages() {
  pageObs?.disconnect();
  const links = $$("#pages a");
  pageObs = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) links.forEach((a) => a.setAttribute("aria-current", String(a.dataset.pg === e.target.id)));
    });
  }, { rootMargin: "-45% 0px -50% 0px" });
  $$("[data-page]").forEach((s) => pageObs.observe(s));
}

$("#reset").onclick = () => { selected.clear(); applyFilter(); syncURL(); };
$("#share").onclick = async () => {
  syncURL();
  try { await navigator.clipboard.writeText(location.href); } catch (_) {}
  const t = $("#toast"); t.textContent = T("copied"); t.hidden = false;
  clearTimeout(t._h); t._h = setTimeout(() => (t.hidden = true), 2200);
};
$$(".seg button").forEach((b) => (b.onclick = () => { lang = b.dataset.lang; renderStatic(); syncURL(); }));

renderStatic();
</script>
</body>
</html>
